pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts,tsx,js,json}"
      run: pnpm biome check --write {staged_files}
      stage_fixed: true
    ty-check:
      glob: "packages/ai/**/*.py"
      run: uv run --directory packages/ai ty check {staged_files}
    ruff-check:
      glob: "packages/ai/**/*.py"
      run: uvx ruff check --fix {staged_files}
      stage_fixed: true
    test:
      run: pnpm turbo test
    pytest:
      glob: "packages/ai/**/*.py"
      run: uv run --directory packages/ai pytest tests/ -q
