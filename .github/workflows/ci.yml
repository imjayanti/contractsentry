name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.12"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Install AI package deps
        run: uv sync
        working-directory: packages/ai

      - name: Lint Python
        run: uv run ruff check contractsentry_ai/ tests/
        working-directory: packages/ai

      - name: Typecheck Python
        run: uv run ty check contractsentry_ai/ tests/
        working-directory: packages/ai

      - name: Test Python
        run: uv run pytest tests/ -v
        working-directory: packages/ai

      - name: Smoke test
        run: |
          node packages/cli/dist/bin.js check \
            --spec examples/petstore/openapi.yaml \
            --files 'examples/petstore/routes/*.ts'
          EXIT=$?
          if [ $EXIT -ne 1 ]; then
            echo "Smoke test failed: expected exit 1 (violations found), got $EXIT"
            exit 1
          fi
          echo "Smoke test passed"
