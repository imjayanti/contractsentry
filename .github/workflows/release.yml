name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      published: ${{ steps.publish.outputs.published }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: changesets/action@v1
        id: changesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        id: publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          printf '//registry.npmjs.org/:_authToken=\nregistry=https://registry.npmjs.org/\n' > /tmp/publish.npmrc
          node scripts/npm-publish.mjs
        env:
          NPM_CONFIG_USERCONFIG: /tmp/publish.npmrc
          NPM_CONFIG_PROVENANCE: "true"

  publish-python:
    name: Publish contractsentry-ai to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.12"

      - name: Build contractsentry-ai
        working-directory: packages/ai
        run: uv build

      - name: Publish to PyPI
        working-directory: packages/ai
        run: uv publish --trusted-publishing always
