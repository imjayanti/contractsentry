[project]
name = "contractsentry-ai"
version = "0.2.0"
description = "AI-powered contract drift detection for ContractSentry"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "fastjsonschema>=2.20.0",
    "msgspec>=0.18.0",
    "typer>=0.12.0",
]

[project.scripts]
contractsentry-ai = "contractsentry_ai.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "ty",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
